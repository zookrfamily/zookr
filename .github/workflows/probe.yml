# One-off: learn how this zingo-cli build behaves, with a throwaway seed.
name: probe zingo-cli
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: zingo-cli
        run: |
          curl -fsSL -o /usr/local/bin/zingo-cli "https://github.com/${{ github.repository }}/releases/download/zingo-cli/zingo-cli-linux-x64"
          chmod +x /usr/local/bin/zingo-cli
      - name: probes
        env:
          S: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon art"
          SRV: https://zec.rocks:443
        run: |
          set +e
          p() { echo; echo "=================== $1 ($(date -u +%T))"; shift; timeout -k 5 "$T" "$@" </dev/null > out.txt 2> err.txt; c=$?; echo "exit=$c ($(date -u +%T))"; echo "--- stdout"; head -c 4000 out.txt; echo; echo "--- stderr"; tail -c 2500 err.txt; echo; }
          T=120
          p "standalone servers" zingo-cli servers
          p "consent + nosync info" zingo-cli --data-dir w1 --server "$SRV" --seed "$S" --birthday 3495600 --remember-online --nosync info
          p "nosync height after info" zingo-cli --data-dir w1 --nosync height
          T=1200
          p "waitsync height, birthday 3495600" zingo-cli --data-dir w1 --server "$SRV" --waitsync height
          p "after sync: spendable_balance offline" zingo-cli --data-dir w1 --offline spendable_balance
          p "after sync: value_transfers offline" zingo-cli --data-dir w1 --offline value_transfers
          p "after sync: transactions offline" zingo-cli --data-dir w1 --offline transactions
          echo; echo "=================== interactive session ($(date -u +%T))"
          ( echo "sync status"; sleep 45; echo "sync status"; sleep 45; echo "sync status"; echo "height"; echo "spendable_balance"; echo "addresses"; echo "quit" ) | timeout -k 5 400 zingo-cli --data-dir w2 --server "$SRV" --seed "$S" --birthday 3495600 --remember-online > out.txt 2> err.txt; echo "exit=$? ($(date -u +%T))"; echo "--- stdout"; head -c 6000 out.txt; echo; echo "--- stderr"; tail -c 3000 err.txt
          echo; echo "=================== files"; ls -la w1 w2 2>/dev/null
